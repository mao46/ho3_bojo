    <main class="cart-page-content">
      <h1>🛒 您的購物車</h1>

      <!-- 購物車內容將會顯示在這裡 -->

      <!-- 例如：商品列表、數量調整、總計金額、結帳按鈕等 -->

      <div class="cart-items">
        <!-- 範例商品 -->

        <div class="cart-item">
          <img src="image/image1.jpg" alt="商品圖片" class="cart-item-image" />

          <div class="cart-item-details">
            <h3>商品名稱A</h3>

            <p>單價：$100</p>
            <input type="number" value="1" min="1" />
          </div>

          <p class="cart-item-subtotal">小計：$100</p>
          <button class="remove-item-btn">移除</button>
        </div>

        <!-- 更多商品 -->
      </div>

      <div class="cart-summary">
        <h3>訂單總計</h3>

        <p>商品總額：$XXX</p>

        <p>運費：$YY</p>

        <h4>總計：$ZZZ</h4>
        <br />
        <a href="checkout.html" class="checkout-btn">前往結帳</a>
      </div>
    </main>

    <footer>

      <p>聯絡我們: 部長信箱@example.com</p>

    <script src="script.js"></script>

    <!-- 如果有針對此頁面的特定JS -->
  </body>

  <script>
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.querySelector(".cart-items");
      const summary = document.querySelector(".cart-summary");

      container.innerHTML = "";

      let total = 0;

      cart.forEach((item, index) => {
        const price = parseInt(item.price.replace(/[^\d]/g, ""));
        const subtotal = price * item.quantity;
        total += subtotal;

        const el = document.createElement("div");
        el.className = "cart-item"; // 新增顏色顯示
        const colorDisplay = item.color ? `<p>顏色：${item.color}</p>` : "";
        el.innerHTML = `
      <img src="${item.image}" class="cart-item-image">
      <div class="cart-item-details">
        <h3>${item.name}</h3>
        ${colorDisplay} <!-- 插入顏色資訊 -->
        <p>尺寸：${item.size}</p>
        <p>單價：${item.price}</p>
        <label>數量：<input type="number" min="1" value="${item.quantity}" data-index="${index}" class="qty-input"></label>
      </div>
      <p class="cart-item-subtotal">小計：NT$${subtotal}</p>
      <button class="remove-item-btn" data-index="${index}">移除</button>
    `;
        container.appendChild(el);
      });

      summary.innerHTML = `
    <h3>訂單總計</h3>
    <p>商品總額：NT$${total}</p>
    <p>運費：NT$0</p>
    <h4>總計：NT$${total}</h4>
    <a href="checkout.html" class="checkout-btn">前往結帳</a>
  `;
    }

    // 數量調整與刪除
    document.addEventListener("input", function (e) {
      if (e.target.classList.contains("qty-input")) {
        const index = e.target.dataset.index;
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart[index].quantity = parseInt(e.target.value) || 1;
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }
    });

    document.addEventListener("click", function (e) {
      if (e.target.classList.contains("remove-item-btn")) {
        const index = e.target.dataset.index;
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }
    });

    document.addEventListener("DOMContentLoaded", renderCart);
  </script>
